services:
  - type: web
    name: platform-orchestrator
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx pnpm@9 install --frozen-lockfile
    startCommand: npx pnpm@9 --filter @platform/orchestrator start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Required — get from Supabase → Settings → Database → Connection string
      - key: DATABASE_URL_SERVICE
        sync: false
      # Required — 32-byte base64 key for token encryption
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: TOKEN_VAULT_KEY
        sync: false
      # Required for Supabase Storage uploads (generated-assets bucket)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI providers — add as you activate each one
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: IDEOGRAM_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: platform-publisher
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx pnpm@9 install --frozen-lockfile
    startCommand: npx pnpm@9 --filter @platform/publisher start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL_SERVICE
        sync: false
      # Must match TOKEN_VAULT_KEY in orchestrator — same key, both services
      - key: TOKEN_VAULT_KEY
        sync: false
      # Social platform OAuth app credentials
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
